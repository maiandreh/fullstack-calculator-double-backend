services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GO_BACKEND_URL: http://localhost:8080
        VITE_JAVA_BACKEND_URL: http://localhost:8081
    ports:
      - "3000:8080"

  backend-go:
    build:
      context: ./backend-go
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  backend-java:
    build:
      context: ./backend-java
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
